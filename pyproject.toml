[project]
name = "argospy"
version = "0.6.3"
description = "Repeatable once/soak checks with reviewable evidence for people and agents"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Peiyang Li" }]
dependencies = []

[project.scripts]
argos = "argos.cli:main"

[project.urls]
Homepage = "https://lpythu.github.io/argos/"
Documentation = "https://lpythu.github.io/argos/"
Repository = "https://github.com/lpythu/argos"
Issues = "https://github.com/lpythu/argos/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argos"]
