namespace: platform
replicas: 1
image:
  repository: harbor.saidc/platform/argos
  tag: latest
  pullSecret: harbor-robot
secret: {}
workloads:
  argos:
    name: argos
    replicas: 1
    port: 8080
    portName: http
    healthPath: /health
    probe: http
    dataPath: /var/lib/saidc/argos
    env: {}
    ingress:
      enabled: false
      className: traefik
      annotations: {}
      hosts: []
