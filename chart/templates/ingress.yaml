{{- range $key, $w := .Values.workloads }}
{{- if and $w.ingress $w.ingress.enabled }}
{{- range $w.ingress.hosts }}
{{- $host := . }}
{{- $path := "/" }}
{{- $pathType := "Prefix" }}
{{- if kindIs "map" . }}
{{- $host = .host }}
{{- $path = default "/" .path }}
{{- $pathType = default "Prefix" .pathType }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-%s" $w.name ($host | replace "*" "wildcard" | replace "." "-") | trunc 63 | trimSuffix "-" }}
  namespace: {{ default $.Values.namespace $w.namespace }}
  {{- if $w.ingress.annotations }}
  annotations:
    {{- range $ak, $av := $w.ingress.annotations }}
    {{ $ak }}: {{ $av | toString | quote }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ default "traefik" $w.ingress.className }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ $path | quote }}
            pathType: {{ $pathType }}
            backend:
              service:
                name: {{ $w.name }}
                port:
                  number: {{ $w.port }}
{{- end }}
{{- end }}
{{- end }}
